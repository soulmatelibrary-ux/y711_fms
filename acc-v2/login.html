<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 — ACC ATD v2</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #0d1117;
            color: #c8d4e0;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #10192a;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 40px 36px;
            width: 360px;
        }
        .title { font-size: 20px; font-weight: bold; color: #4fc3f7; margin-bottom: 4px; }
        .sub { color: #7a8a9a; font-size: 12px; margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #7a8a9a; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 9px 12px;
            background: #0d1117;
            border: 1px solid #1e2a3a;
            border-radius: 5px;
            color: #c8d4e0;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #4fc3f7; }
        .error { color: #ff3b30; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
        button {
            width: 100%;
            padding: 10px;
            background: #4fc3f7;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #81d4fa; }
        .hint { text-align: center; color: #4a5568; font-size: 11px; margin-top: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="title">✈ ACC ATD v2</div>
    <div class="sub">항공교통관제 출발시간 관리 시스템</div>
    <div class="field">
        <label>사용자명</label>
        <input type="text" id="username" placeholder="username" autocomplete="username">
    </div>
    <div class="field">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="password" autocomplete="current-password">
    </div>
    <div class="error" id="error"></div>
    <button id="btn-login">로그인</button>
    <div class="hint">계정 정보는 관리자에게 문의하세요</div>
</div>
<script>
    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const err = document.getElementById('error');
        err.textContent = '';

        if (!u || !p) { err.textContent = '사용자명과 비밀번호를 입력하세요'; return; }

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('username', data.user.username);
                window.location.href = '/';
            } else {
                err.textContent = data.error || '로그인 실패';
            }
        } catch (e) {
            err.textContent = '서버 연결 오류';
        }
    }
</script>
</body>
</html>
