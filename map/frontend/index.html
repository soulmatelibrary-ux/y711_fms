<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 지도 서비스 - 항공편 경로 분석</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-map"></i> 3D 지도 서비스</h1>
            <p class="subtitle">항공편 경로 & 섹터 시각화</p>
        </div>
    </header>

    <div class="container">
        <!-- 컨트롤 패널 (좌측) -->
        <aside class="control-panel">
            <section class="panel-section">
                <h3><i class="fas fa-eye"></i> 표시 옵션</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-sectors" checked>
                    <span>섹터 표시</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-coastlines" checked>
                    <span>해안선 표시</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-fixpoints">
                    <span>지점 표시</span>
                </label>
            </section>

            <section class="panel-section">
                <h3><i class="fas fa-cog"></i> 카메라 제어</h3>
                <div class="button-group">
                    <button id="reset-camera-btn" class="btn btn-primary">
                        <i class="fas fa-undo"></i> 초기화
                    </button>
                    <button id="zoom-in-btn" class="btn btn-secondary">
                        <i class="fas fa-search-plus"></i> 확대
                    </button>
                    <button id="zoom-out-btn" class="btn btn-secondary">
                        <i class="fas fa-search-minus"></i> 축소
                    </button>
                </div>
                <div class="help-text">
                    <p><strong>조작법:</strong></p>
                    <ul>
                        <li>Ctrl + 좌클릭: 이동</li>
                        <li>Ctrl + 우클릭: 회전</li>
                        <li>휠: 확대/축소</li>
                    </ul>
                </div>
            </section>

            <section class="panel-section">
                <h3><i class="fas fa-palette"></i> 테마</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="dark-mode" checked>
                    <span>어두운 모드</span>
                </label>
            </section>

            <section class="panel-section">
                <h3><i class="fas fa-info-circle"></i> 정보</h3>
                <div class="info-box">
                    <p id="map-info-text">지도 로딩 중...</p>
                    <div id="map-stats">
                        <div class="stat-item">
                            <label>섹터:</label>
                            <span id="stat-sectors">0</span>
                        </div>
                        <div class="stat-item">
                            <label>지점:</label>
                            <span id="stat-fixpoints">0</span>
                        </div>
                        <div class="stat-item">
                            <label>항로:</label>
                            <span id="stat-routes">0</span>
                        </div>
                    </div>
                </div>
            </section>
        </aside>

        <!-- 메인 콘텐츠 (우측) -->
        <main class="main-content">
            <!-- 3D 지도 캔버스 -->
            <div id="map-container" class="map-container">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>3D 지도 초기화 중...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 렌더러 모듈들 -->
    <script src="../js/renderers/coordinate-transformer.js"></script>
    <script src="../js/renderers/map-renderer.js"></script>

    <!-- 지도 서비스 초기화 -->
    <script src="main.js"></script>
</body>
</html>
