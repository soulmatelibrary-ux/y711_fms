<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Map Service Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial; background: #1a1a2e; color: #fff; }
        #canvas { width: 100%; height: 600px; background: #000; border: 1px solid #666; }
        .log { background: #222; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 200px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🗺️ Map Service 진단</h1>
    <div id="canvas"></div>
    <div class="log" id="log"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/renderers/coordinate-transformer.js"></script>
    <script src="../js/renderers/map-renderer.js"></script>

    <script>
        const log = (msg) => {
            const el = document.getElementById('log');
            el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        };

        log('🔍 진단 시작...');

        // 1. Three.js 확인
        log(`✅ Three.js: ${typeof THREE !== 'undefined' ? '로드됨' : '로드 실패'}`);

        // 2. CoordinateTransformer 확인
        setTimeout(() => {
            log(`✅ CoordinateTransformer: ${typeof window.initializeCoordinateTransformer !== 'undefined' ? '로드됨' : '로드 실패'}`);

            // 3. Transformer 초기화
            try {
                const transformer = initializeCoordinateTransformer();
                const pos = transformer.getCameraPosition();
                log(`✅ Transformer 초기화: 카메라 위치 = (${pos.x.toFixed(0)}, ${pos.y.toFixed(0)}, ${pos.z.toFixed(0)})`);
            } catch (e) {
                log(`❌ Transformer 초기화 실패: ${e.message}`);
            }

            // 4. MapRenderer 확인
            log(`✅ MapRenderer: ${typeof window.MapRenderer !== 'undefined' ? '로드됨' : '로드 실패'}`);

            // 5. MapRenderer 초기화
            try {
                const renderer = new MapRenderer('#canvas', { theme: 'dark' });
                log(`✅ MapRenderer 초기화 완료`);
                log(`   Canvas 크기: ${renderer.width}x${renderer.height}`);
                log(`   Scene 객체 수: ${renderer.scene.children.length}`);
            } catch (e) {
                log(`❌ MapRenderer 초기화 실패: ${e.message}`);
            }
        }, 500);
    </script>
</body>
</html>
